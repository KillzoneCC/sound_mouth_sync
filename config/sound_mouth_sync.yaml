# sound_mouth_sync configuration
# Loaded via rosparam in sound_mouth_sync.launch

sound_mouth_sync:
  emotions:
    list:
      - neutral
      - happy
      - sad
      - angry
      - surprised
      - excited
      - sleepy
      - love
      - confused
      - scared
      - bored
      - calm
      - disgusted
      - tired
    default_emotion: neutral

  display:
    default_emotion: neutral
    auto_mode: true                  # auto-switch oscillogram on sound, back to emotion on silence
    silence_return_sec: 3.0          # seconds of silence before returning to emotion mode
    # Idle sleep (mouth OLED): after no speech and no walking for idle_sleep_sec
    idle_sleep_enabled: true
    idle_sleep_sec: 60.0             # seconds of inactivity before showing idle_sleep_emotion
    idle_sleep_emotion: sleepy
    fall_emotion: angry              # shown while /robot/posture is fall_*
    posture_topic: /robot/posture    # std_msgs/String from ainex_peripherals joystick_control
    movement_topic: /robot/is_moving # std_msgs/Bool — True while gait moving
    idle_require_movement_signal: true  # if true, never idle-sleep until at least one /robot/is_moving (no false sleep without joystick)
    audio_level_topic: /audio/level    # Float32 RMS 0..1 from audio_capture — wakes oscillogram if wave peaks are too low

  audio_capture:
    rate: 48000                      # sample rate Hz (48000 = native USB card rate)
    chunk_size: 1024                 # samples per chunk
    wave_width: 128                  # oscillogram points (match display width)

  hardware:
    i2c_port: 1
    i2c_address: 0x3D
    width: 128
    height: 64
    rotate: 2                        # 0=normal, 2=180° (display mounted upside-down)
