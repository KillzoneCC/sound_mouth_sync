<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1180" width="980" height="1180">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d7a3e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E5A8A"/>
    </marker>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 11px; fill: #555; }
      .node { fill: #4A90D9; stroke: #2E5A8A; stroke-width: 2; }
      .node-text { font-family: system-ui, sans-serif; font-size: 10px; fill: #fff; text-anchor: middle; }
      .topic { font-family: "Consolas", monospace; font-size: 8.5px; fill: #1a6b2e; font-weight: 600; }
      .topic-desc { font-family: system-ui, sans-serif; font-size: 8px; fill: #2d5a32; font-style: italic; }
      .frame-second { fill: #E8EEF9; stroke: #5B7FC7; stroke-width: 2.5; }
      .frame-label { font-family: system-ui, sans-serif; font-size: 11px; fill: #3d5a99; font-weight: 700; }
      .hw { fill: #9B8FD9; stroke: #5E4FA2; stroke-width: 2; }
      .hw-text { font-family: system-ui, sans-serif; font-size: 10px; fill: #fff; text-anchor: middle; }
      .legend-box { fill: #fafafa; stroke: #ccc; stroke-width: 1; }
      .legend-title { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #222; }
      .legend-item { font-family: system-ui, sans-serif; font-size: 10px; fill: #333; }
      .svc-box { fill: #FFF5E6; stroke: #E67E22; stroke-width: 2; stroke-dasharray: 6 4; }
      .svc-text { font-family: system-ui, sans-serif; font-size: 9.5px; fill: #8B4513; text-anchor: middle; }
    </style>
  </defs>

  <text x="20" y="28" class="title">sound_mouth_sync: второй дисплей — ноды, топики (тип + назначение в скобках)</text>
  <text x="20" y="46" class="subtitle">Синий — нода | зелёный у стрелки — топик | оранжевый — в пакете нет ROS-сервиса (логика внутри display_node)</text>

  <rect x="30" y="58" width="220" height="68" rx="6" class="node"/>
  <text x="140" y="80" class="node-text">Другие пакеты ROS</text>
  <text x="140" y="94" class="node-text">(TTS, эмоции, телеоп)</text>
  <text x="140" y="108" class="node-text" style="font-size:8px;opacity:0.95">(команды рту + подписка на состояние)</text>

  <rect x="280" y="58" width="240" height="68" rx="6" class="node"/>
  <text x="400" y="80" class="node-text">joystick_control</text>
  <text x="400" y="94" class="node-text">(ainex_peripherals)</text>
  <text x="400" y="108" class="node-text" style="font-size:8px">(осанка и ходьба для рта)</text>

  <rect x="30" y="195" width="260" height="78" rx="6" class="node"/>
  <text x="160" y="218" class="node-text">mouth_audio_capture_node</text>
  <text x="160" y="232" class="node-text">audio_capture_node.py</text>
  <text x="160" y="248" class="node-text" style="font-size:8px">(PulseAudio, волна 128 + RMS)</text>

  <rect x="330" y="145" width="620" height="360" rx="8" class="frame-second"/>
  <text x="345" y="168" class="frame-label">Второй дисплей (рот)</text>

  <rect x="360" y="185" width="280" height="78" rx="6" class="node"/>
  <text x="500" y="208" class="node-text">mouth_display_node</text>
  <text x="500" y="222" class="node-text">display_node.py</text>
  <text x="500" y="238" class="node-text" style="font-size:8px">(emotion/oscillogram, I2C на OLED)</text>

  <rect x="420" y="295" width="220" height="58" rx="6" class="hw"/>
  <text x="530" y="318" class="hw-text">OLED SSD1306 128x64</text>
  <text x="530" y="334" class="hw-text">(аппарат, не топик)</text>

  <line x1="500" y1="263" x2="530" y2="293" stroke="#5E4FA2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="538" y="282" class="subtitle" style="font-size:9px;fill:#5E4FA2;">I2C</text>

  <path d="M 290 234 L 330 234 L 330 224 L 355 224" fill="none" stroke="#2d7a3e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="295" y="212" class="topic">/mouth/audio_wave, Float32MultiArray</text>
  <text x="295" y="224" class="topic-desc">(волна для осциллограммы и проверки «слышно»)</text>

  <path d="M 160 195 L 160 126" fill="none" stroke="#2d7a3e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="168" y="168" class="topic">/audio/level, Float32</text>
  <text x="168" y="180" class="topic-desc">(громкость наружу и в ноду рта)</text>

  <path d="M 250 92 L 310 92 L 310 224 L 355 224" fill="none" stroke="#2d7a3e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="318" y="82" class="topic">/mouth/mode, String</text>
  <text x="318" y="94" class="topic-desc">(команда: emotion или oscillogram)</text>
  <text x="318" y="108" class="topic">/mouth/emotion, String</text>
  <text x="318" y="120" class="topic-desc">(какую эмоцию рисовать)</text>

  <path d="M 400 126 L 400 175 L 355 175 L 355 210" fill="none" stroke="#2d7a3e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="412" y="148" class="topic">/robot/posture, String</text>
  <text x="412" y="160" class="topic-desc">(падение — только эмоция, без волны)</text>
  <text x="412" y="174" class="topic">/robot/is_moving, Bool</text>
  <text x="412" y="186" class="topic-desc">(простой и режим «сна» рта)</text>

  <path d="M 360 224 L 270 224 L 270 110 L 250 110" fill="none" stroke="#2d7a3e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="258" y="216" class="topic">/mouth/current_mode, String latch</text>
  <text x="258" y="228" class="topic-desc">(фактический режим на рту)</text>
  <text x="258" y="242" class="topic">/mouth/current_emotion, String latch</text>
  <text x="258" y="254" class="topic-desc">(какая эмоция отображена)</text>

  <rect x="30" y="530" width="420" height="72" rx="6" class="svc-box"/>
  <text x="240" y="556" class="svc-text">ROS-сервисы в пакете не объявлены</text>
  <text x="240" y="572" class="svc-text">(нет запрос/ответ; ветвление «звук / тишина» — в коде display_node)</text>
  <text x="240" y="588" class="svc-text">см. письменную блок-схему в SECOND_DISPLAY_ARCHITECTURE.md</text>

  <rect x="480" y="520" width="470" height="240" rx="6" class="legend-box"/>
  <text x="495" y="542" class="legend-title">Легенда</text>
  <rect x="495" y="552" width="24" height="16" rx="3" class="node"/>
  <text x="530" y="565" class="legend-item">Синий — ROS-нода, в скобках роль</text>
  <text x="495" y="585" class="topic" style="font-size:9px;">/topic, Type</text>
  <text x="530" y="585" class="legend-item">— зелёный: топик; курсив — зачем нужен поток</text>
  <rect x="495" y="598" width="100" height="20" rx="4" class="svc-box"/>
  <text x="605" y="612" class="legend-item">Оранжевый — не сервис, а пометка про логику в ноде</text>
  <rect x="495" y="622" width="24" height="16" rx="3" class="frame-second" style="fill:#E8EEF9;stroke:#5B7FC7;"/>
  <text x="530" y="635" class="legend-item">Рамка — контур «второй дисплей»</text>
  <rect x="495" y="645" width="24" height="16" rx="3" class="hw"/>
  <text x="530" y="658" class="legend-item">Фиолетовый — OLED (аппарат)</text>
  <text x="495" y="680" class="legend-item" style="font-size:9px;color:#666;">Стрелка: от publisher к subscriber</text>
  <text x="495" y="698" class="legend-item" style="font-size:9px;color:#666;">Два исхода из audio_capture: на «другие» и на рот — один топик /audio/level</text>

  <text x="20" y="1145" class="subtitle">Поток «звук есть / нет» и возврат в emotion — в markdown-файле, раздел «Письменная блок-схема»</text>
</svg>
