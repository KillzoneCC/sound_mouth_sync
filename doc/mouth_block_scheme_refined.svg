<text x="395" y="442" font-size="8" fill="#157a6c" text-anchor="middle" font-family="system-ui,sans-serif">pub → sub</text>
<text x="530" y="492" font-size="9" fill="#333" font-weight="700" font-family="system-ui,sans-serif">Подписки display_node (входящие топики):</text>
<polygon points="530,500 538,536 730,536 722,500" fill="#c5ebe4" stroke="#157a6c" stroke-width="2"/>
<text x="630" y="516" font-size="9" fill="#0d4f4a" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">/mouth/mode</text>
<text x="630" y="530" font-size="8" fill="#0d4f4a" text-anchor="middle" font-family="system-ui,sans-serif">String</text>
<text x="740" y="516" font-size="8" fill="#555" font-family="system-ui,sans-serif">← внешние ноды</text>
<text x="740" y="530" font-size="7.5" fill="#777" font-family="system-ui,sans-serif">(команда: emotion | oscillogram)</text>
<polygon points="530,548 538,584 730,584 722,548" fill="#c5ebe4" stroke="#157a6c" stroke-width="2"/>
