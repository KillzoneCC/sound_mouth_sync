<text x="630" y="612" font-size="9" fill="#0d4f4a" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">/robot/posture</text>
<text x="630" y="626" font-size="8" fill="#0d4f4a" text-anchor="middle" font-family="system-ui,sans-serif">String</text>
<text x="740" y="612" font-size="8" fill="#555" font-family="system-ui,sans-serif">← joystick_control</text>
<text x="740" y="626" font-size="7.5" fill="#777" font-family="system-ui,sans-serif">(stand / fall_*)</text>
<polygon points="530,644 538,680 730,680 722,644" fill="#c5ebe4" stroke="#157a6c" stroke-width="2"/>
<text x="630" y="660" font-size="9" fill="#0d4f4a" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">/robot/is_moving</text>
<text x="630" y="674" font-size="8" fill="#0d4f4a" text-anchor="middle" font-family="system-ui,sans-serif">Bool</text>
<text x="740" y="660" font-size="8" fill="#555" font-family="system-ui,sans-serif">← joystick_control</text>
<text x="740" y="674" font-size="7.5" fill="#777" font-family="system-ui,sans-serif">(ходьба: таймер простоя)</text>
<rect x="530" y="708" width="490" height="78" rx="6" fill="#fff6ed" stroke="#d35400" stroke-width="2" stroke-dasharray="6 4"/>
<text x="775" y="726" font-size="10" fill="#8b4513" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">«СЕРВИСЫ» — логические вопрос-ответ в коде display_node</text>
<text x="545" y="744" font-size="8.5" fill="#a04000" font-family="system-ui,sans-serif">Слышно? → waveform_is_audible() → да/нет → переключить режим</text>
<text x="545" y="758" font-size="8.5" fill="#a04000" font-family="system-ui,sans-serif">Упал?   → posture == fall_* → да/нет → принудить эмоцию</text>
<text x="545" y="772" font-size="8.5" fill="#a04000" font-family="system-ui,sans-serif">Простой? → elapsed ≥ idle_sleep_sec → да/нет → sleepy</text>
<text x="545" y="784" font-size="7.5" fill="#999" font-family="system-ui,sans-serif">В ROS пакете srv не объявлены. Можно добавить (см. §4 в .md)</text>
<text x="530" y="796" font-size="9" fill="#333" font-weight="700" font-family="system-ui,sans-serif">Публикация наружу:</text>
