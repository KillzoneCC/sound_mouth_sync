<text x="630" y="578" font-size="8" fill="#0d4f4a" text-anchor="middle" font-family="system-ui,sans-serif">String</text>
<text x="740" y="564" font-size="8" fill="#555" font-family="system-ui,sans-serif">← внешние ноды</text>
<text x="740" y="578" font-size="7.5" fill="#777" font-family="system-ui,sans-serif">(какую эмоцию показать)</text>
