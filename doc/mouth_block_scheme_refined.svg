</defs>
<text x="530" y="28" font-size="15" fill="#111" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">sound_mouth_sync — архитектура: ноды, топики, сервисы</text>
<text x="530" y="50" font-size="10" fill="#555" text-anchor="middle" font-family="system-ui,sans-serif">Поэтапный запуск: roslaunch → rosparam → обе ноды параллельно</text>
<rect x="730" y="62" width="310" height="135" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="745" y="82" font-size="12" fill="#000" font-weight="700" font-family="system-ui,sans-serif">Легенда</text>
<rect x="745" y="92" width="22" height="14" rx="6" fill="#2f6b9a" stroke="#1a3d5c" stroke-width="2"/>
<text x="775" y="104" font-size="9" fill="#111" font-family="system-ui,sans-serif">Нода (ROS node)</text>
<polygon points="745,114 753,132 815,132 807,114" fill="#c5ebe4" stroke="#157a6c" stroke-width="1.5"/>
<text x="825" y="126" font-size="9" fill="#111" font-family="system-ui,sans-serif">Топик (ROS topic)</text>
<rect x="745" y="140" width="62" height="14" rx="4" fill="#fff6ed" stroke="#d35400" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="815" y="152" font-size="9" fill="#8b4513" font-family="system-ui,sans-serif">Сервис / лог. вопрос-ответ</text>
<rect x="745" y="162" width="22" height="14" rx="6" fill="#9b8fd9" stroke="#5e4fa2" stroke-width="2"/>
<text x="775" y="174" font-size="9" fill="#111" font-family="system-ui,sans-serif">Аппаратный модуль (OLED)</text>
<text x="745" y="192" font-size="8" fill="#666" font-family="system-ui,sans-serif">Стрелка = поток данных (pub → sub)</text>
<rect x="340" y="72" width="360" height="36" rx="6" fill="#e8e8f0" stroke="#888" stroke-width="1.5"/>
<text x="520" y="96" font-size="9" fill="#333" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">Этап 0: roslaunch → rosparam load YAML → старт двух нод</text>
<rect x="40" y="128" width="440" height="220" rx="6" fill="#2f6b9a" stroke="#1a3d5c" stroke-width="2"/>
<text x="260" y="150" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">НОДА 1: mouth_audio_capture_node</text>
<text x="260" y="168" font-size="9" fill="#cde" font-family="system-ui,sans-serif">(audio_capture_node.py)</text>
<text x="60" y="190" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 1.1: Запуск PulseAudio</text>
<text x="60" y="206" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 1.2: Поиск USB-карты → USB нет? → shutdown</text>
<text x="60" y="222" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 1.3: Создание PA sink usb_output</text>
<text x="60" y="238" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 1.4: TCP:4713 (для хоста)</text>
<text x="60" y="254" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 1.5: parec → PCM → RMS + downsample</text>
<text x="60" y="272" font-size="9" fill="#fff" font-weight="700" font-family="system-ui,sans-serif">Этап 1.6: Publisher → два топика ▼</text>
<text x="60" y="290" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 1.7: capture_loop (поток) — каждый чанк → pub</text>
<text x="60" y="322" font-size="8" fill="#fdd" font-family="system-ui,sans-serif">Публикует непрерывно. Тишина = нули. Нет ветки «сон».</text>
<rect x="520" y="128" width="520" height="220" rx="6" fill="#2f6b9a" stroke="#1a3d5c" stroke-width="2"/>
<text x="780" y="150" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">НОДА 2: mouth_display_node</text>
<text x="780" y="168" font-size="9" fill="#cde" font-family="system-ui,sans-serif">(display_node.py)</text>
<text x="540" y="190" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 2.1: Чтение конфига (sms_config + rosparam)</text>
<text x="540" y="206" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 2.2: Загрузка PNG из resources/emotions/</text>
<text x="540" y="222" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 2.3: I2C → OLED SSD1306 (или без экрана)</text>
<text x="540" y="238" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 2.4: Publisher → current_mode, current_emotion</text>
<text x="540" y="254" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 2.5: Начальное состояние → emotion + neutral</text>
<text x="540" y="272" font-size="9" fill="#fff" font-weight="700" font-family="system-ui,sans-serif">Этап 2.6: Subscriber × 6 (см. ниже)</text>
<text x="540" y="290" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 2.7: Таймеры (auto_return, idle, sleepy_anim)</text>
<text x="540" y="308" font-size="9" fill="#ddd" font-family="system-ui,sans-serif">Этап 2.8: rospy.spin() — ждёт колбэки</text>
<text x="540" y="326" font-size="8" fill="#fdd" font-family="system-ui,sans-serif">Решения «слышно?» / «упал?» / «спит?» — здесь.</text>
<polygon points="80,376 90,416 280,416 270,376" fill="#c5ebe4" stroke="#157a6c" stroke-width="2"/>
<text x="180" y="394" font-size="10" fill="#0d4f4a" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">/mouth/audio_wave</text>
<text x="180" y="408" font-size="8" fill="#0d4f4a" text-anchor="middle" font-family="system-ui,sans-serif">Float32MultiArray (128 точек)</text>
<polygon points="80,428 90,468 280,468 270,428" fill="#c5ebe4" stroke="#157a6c" stroke-width="2"/>
<text x="180" y="446" font-size="10" fill="#0d4f4a" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">/audio/level</text>
<text x="180" y="460" font-size="8" fill="#0d4f4a" text-anchor="middle" font-family="system-ui,sans-serif">Float32 (RMS 0..1)</text>
